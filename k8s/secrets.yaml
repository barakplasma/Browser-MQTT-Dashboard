# TEMPLATE — fill in real values before applying, then add this file to .gitignore.
# For production, use Sealed Secrets (https://github.com/bitnami-labs/sealed-secrets)
# or external-secrets-operator instead of committing plaintext credentials.
apiVersion: v1
kind: Secret
metadata:
  name: vector-s3-credentials
  namespace: iot-pipeline
type: Opaque
stringData:
  S3_BUCKET: "REPLACE_WITH_YOUR_BUCKET_NAME"
  # Full URL, e.g. https://<account-id>.r2.cloudflarestorage.com
  #           or  https://s3.us-west-001.backblazeb2.com
  S3_ENDPOINT: "REPLACE_WITH_YOUR_S3_ENDPOINT_URL"
  AWS_ACCESS_KEY_ID: "REPLACE_WITH_YOUR_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "REPLACE_WITH_YOUR_SECRET_ACCESS_KEY"
