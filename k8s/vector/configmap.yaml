apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-config
  namespace: iot-pipeline
data:
  vector.toml: |
    # ── Sources ──────────────────────────────────────────────────────────────────
    [sources.tasmota_mqtt]
    type      = "mqtt"
    host      = "broker.emqx.io"
    port      = 1883
    topic     = "tele/tasmota_145ABA/SENSOR"
    client_id = "vector-tasmota-k8s"

    # ── Transforms ───────────────────────────────────────────────────────────────
    [transforms.parse_tasmota]
    type   = "remap"
    inputs = ["tasmota_mqtt"]
    source = '''
      payload = parse_json!(string!(.message))

      .time           = parse_timestamp!(payload.Time, format: "%Y-%m-%dT%H:%M:%S")
      .temperature    = to_float!(payload.BME680.Temperature)
      .humidity       = to_float!(payload.BME680.Humidity)
      .dew_point      = to_float(payload.BME680.DewPoint) ?? null
      .pressure       = to_float(payload.BME680.Pressure) ?? null
      .gas_resistance = to_float(payload.BME680.Gas) ?? null
      .topic          = .topic

      del(.message)
      del(.source_type)
    '''

    # ── Sinks ─────────────────────────────────────────────────────────────────────
    [sinks.s3_parquet]
    type   = "aws_s3"
    inputs = ["parse_tasmota"]

    bucket = "${S3_BUCKET}"
    region = "il-central-1"

    # Hive-partitioned prefix — one directory per day, readable by DuckDB/Athena.
    key_prefix         = "tasmota/year=%Y/month=%m/day=%d/hour=%H/"
    filename_extension = "csv.gz"

    compression = "gzip"

    encoding.codec = "csv"
    encoding.csv.fields = ["time", "temperature", "humidity", "dew_point", "pressure", "gas_resistance", "topic"]

    # One file per hour minimum (~60 rows at ~1 msg/min).
    batch.timeout_secs = 3600

    [sinks.s3_parquet.auth]
    access_key_id     = "${AWS_ACCESS_KEY_ID}"
    secret_access_key = "${AWS_SECRET_ACCESS_KEY}"
