apiVersion: v1
kind: ConfigMap
metadata:
  name: sensibo-connect-config
  namespace: iot-pipeline
data:
  connect.yaml: |
    input:
      generate:
        interval: 15m
        mapping: 'root = {}'

    pipeline:
      processors:
        - http:
            url: https://home.sensibo.com/api/v2/pods/TcYdVDr4/measurements?apiKey=${SENSIBO_API_KEY}
            verb: GET
            headers:
              Accept: application/json
        - mapping: |
            let r = this.result.index(0)
            root.time        = $r.time.time
            root.pm25        = $r.pm25
            root.iaq         = $r.iaq
            root.rssi        = $r.rssi
            root.motion      = if $r.motion { 1 } else { 0 }

    output:
      aws_s3:
        bucket: ${S3_BUCKET}
        path: 'sensibo/year=${! now().ts_strftime("%Y") }/month=${! now().ts_strftime("%m") }/day=${! now().ts_strftime("%d") }/hour=${! now().ts_strftime("%H") }/${! uuid_v4() }.parquet'
        region: il-central-1
        credentials:
          id: ${AWS_ACCESS_KEY_ID}
          secret: ${AWS_SECRET_ACCESS_KEY}
        batching:
          count: 0
          period: 1h
          processors:
            - parquet_encode:
                schema:
                  - {name: time,   type: UTF8}
                  - {name: pm25,   type: INT32}
                  - {name: iaq,    type: INT32}
                  - {name: rssi,   type: INT32}
                  - {name: motion, type: INT32}
                default_compression: zstd
